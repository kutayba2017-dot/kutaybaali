function u8(b){const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}

async function pushSub(){
 const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
 if(!sub){
  const j=await (await fetch(PUSHFN)).json(),o={userVisibleOnly:true,applicationServerKey:u8(j.key)};
  try{sub=await reg.pushManager.subscribe(o)}catch(e){const old=await reg.pushManager.getSubscription();if(!old)throw e;await old.unsubscribe();sub=await reg.pushManager.subscribe(o)}
 }
 const k=sub.toJSON(),r=await sb.rpc('push_save',{p_endpoint:k.endpoint,p_p256dh:k.keys.p256dh,p_auth:k.keys.auth});
 return !r.error
}
